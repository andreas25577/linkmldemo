# FORELØPIG UTKAST til demo. Begrepseierne er fiktive. Ikke godkjent faglig eller juridisk.
begreper:
- id: stb:soknad-om-statsborgerskap
  anbefalt_term:
    nb: søknad om norsk statsborgerskap
    nn: søknad om norsk statsborgarskap
  tillatt_term:
  - statsborgersøknad
  definisjon: henvendelse der en person ber om å få norsk statsborgerskap
  forhold_til_kilde: basert
  kilde: statsborgerloven § 7 første ledd
  opphav: stbl. § 7
  status: forslag
  begrepseier: statsborgerskap
  samling: statsborgerskap
  assosiativ:
  - til: ext:soker
    rolle: fremmes av
  - til: stb:vedtak-om-statsborgerskap
    rolle: avgjøres ved
  - til: ext:identitetsdokument
    rolle: dokumenteres med
  - til: fe:politiattest
    rolle: følges av
  - til: fe:oppholdsperiode
    rolle: bygger på
  - til: fe:muntlig-norskprove
    rolle: dokumenteres med
  - til: stb:statsborgerprove
    rolle: dokumenteres med
  - til: fe:straffereaksjon
    rolle: påvirkes av
  - til: stb:oppmote
    rolle: inngis ved
  - til: fe:klarlagt-identitet
    rolle: forutsetter
  - til: fe:bosatt-i-riket
    rolle: forutsetter
  - til: fe:ankomst-til-riket
    rolle: bygger på
  - til: stb:unntak-fra-provekrav
    rolle: kan ha
  partitiv:
  - fe:soknadstidspunkt
  - fe:saksbehandlingsgebyr
  - stb:grunnlag-for-oppholdstidskrav
  - stb:oppholdstid
