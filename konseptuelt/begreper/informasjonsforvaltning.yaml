    term: C1
- id: fe:muntlig-norskprove
  anbefalt_term:
    nb: muntlig prøve i norsk
    nn: munnleg prøve i norsk
  tillatt_term:
  - norskprøve
  definisjon: prøve som måler ferdigheter i å snakke og forstå norsk
  forhold_til_kilde: basert
  kilde: statsborgerloven § 8, utlendingsloven § 62 første ledd bokstav d
  merknad: 'Nivåkravet varierer: minimum B1 for statsborgerskap (statsborgerloven § 8) og A2 for permanent oppholdstillatelse
    (utlendingsforskriften § 11-9)'
  opphav: stbl. § 8 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  partitiv:
  - fe:ferdighetsniva
- id: fe:norsk-statsborgerskap
  anbefalt_term:
    nb: norsk statsborgerskap
    nn: norsk statsborgarskap
  definisjon: statsborgerskap der staten er Norge
  forhold_til_kilde: egendefinert
  opphav: stbl. § 1 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
