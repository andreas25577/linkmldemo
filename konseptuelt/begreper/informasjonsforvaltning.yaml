  - ext:statsborgerskap
- id: fe:okonomisk-stonad
  anbefalt_term:
    nb: økonomisk stønad
    nn: økonomisk stønad
  tillatt_term:
  - økonomisk sosialhjelp
  definisjon: stønad til livsopphold etter lov om sosiale tjenester i arbeids- og velferdsforvaltningen
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 17-7g første ledd
  merknad: Opplysningene kan omfatte beløp, art, varighet og antall utbetalinger. Avgjør blant annet om underholdskravet
    er oppfylt. Gjenbrukssøket i begrepskatalogen 2026-11-19 ga ingen treff
  opphav: utf. § 17-7g, stbf. § 14-3
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
  se_ogsa:
  - ext:kvalifiseringsstonad
- id: fe:oppholdsperiode
  anbefalt_term:
    nb: oppholdsperiode
    nn: opphaldsperiode
  definisjon: sammenhengende tidsrom der en person har oppholdt seg i riket med én oppholdstillatelse
  forhold_til_kilde: egendefinert
  opphav: stbl. § 7 e, forskriften kap. 3 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  assosiativ:
  - til: fe:oppholdstillatelse
    rolle: bygger på
- id: fe:oppholdstillatelse
  anbefalt_term:
    nb: oppholdstillatelse
    nn: opphaldsløyve
  definisjon: tillatelse som gir en utlending rett til å oppholde seg i riket utover tre måneder, og eventuelt til
    å ta arbeid
  forhold_til_kilde: basert
  kilde: utlendingsloven §§ 55 og 60
  merknad: Kreves for opphold utover tre måneder og for å ta arbeid. Opphold i et annet Schengenland likestilles
    med opphold i riket ved beregningen. UDI har ikke publisert begrepet. Skatteetaten har et folkeregisterbegrep
    med samme term, koblet som nært samsvar
  opphav: stbl. § 7 e (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  naer:
  - ext:oppholdstillatelse-skatt
- id: fe:opplaering-i-norsk-og-samfunnskunnskap
  anbefalt_term:
    nb: opplæring i norsk og samfunnskunnskap
    nn: opplæring i norsk og samfunnskunnskap
  definisjon: opplæring etter integreringsloven som en utlending har plikt eller rett til å delta i
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 17-7e første ledd bokstav b
  merknad: Opplysningene gjelder gjennomføring, resultat av avsluttende prøver og fritak. Statsborgerforskriften
    viser fortsatt til introduksjonsloven. Gjenbrukssøket i begrepskatalogen 2026-11-19 ga ingen treff
  opphav: utf. § 17-7e første ledd, stbf. § 14-6
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
  se_ogsa:
  - fe:muntlig-norskprove
- id: fe:opplysninger-om-utdanning
  anbefalt_term:
    nb: opplysninger om utdanning
    nn: opplysningar om utdanning
  definisjon: opplysninger om en persons utdanning og studier, som opptak, progresjon, permisjoner, vitnemål og
    resultater
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 17-7k første ledd
  merknad: Termen er et forslag. Etter § 17-7k kan opplysningene også gjelde bolig og underhold
  opphav: utf. §§ 17-7e og 17-7k, stbf. §§ 14-6 og 14-7
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
  se_ogsa:
  - fe:utdanningsinstitusjon
