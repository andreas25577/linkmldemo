    nn: ferdigheitsnivå
  definisjon: trinn på en skala som angir hvor godt en person behersker et språk
  forhold_til_kilde: egendefinert
  merknad: Nivåene i det felles europeiske rammeverket for språk
  opphav: stbl. § 8 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
