    nn: prøveresultat
  definisjon: utfallet av en avlagt prøve
  forhold_til_kilde: egendefinert
  opphav: stbl. § 8, utl. § 62 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
