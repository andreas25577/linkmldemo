  - kode: BESTATT
    term: bestått
  - kode: IKKE_BESTATT
    term: ikke bestått
- id: fe:registrert-inntekt
  anbefalt_term:
    nb: registrert inntekt
    nn: registrert inntekt
  definisjon: inntekt som framgår av siste skatteoppgjør eller av skattemyndighetenes bekreftelse på innrapportert
    inntekt for foregående år
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 10-9 første ledd
  opphav: forskriften § 10-9 første ledd (flyttet fra utkastet for ektefeller og samboere)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:saksbehandlingsgebyr
  anbefalt_term:
    nb: saksbehandlingsgebyr
    nn: saksbehandlingsgebyr
  tillatt_term:
  - søknadsgebyr
  definisjon: beløp som må betales for å få en søknad behandlet
  forhold_til_kilde: basert
  kilde: utlendingsloven § 89, statsborgerforskriften § 15-1
  merknad: Kan kreves for søknader etter utlendingsloven, men ikke for søknader om beskyttelse. Gjelder også søknader
    om statsborgerskap. Satsene står i forskriftene
  opphav: forskriften kap. 15 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  generisk:
  - ext:gebyr
- id: fe:soknadstidspunkt
  anbefalt_term:
    nb: søknadstidspunkt
    nn: søknadstidspunkt
  definisjon: tidspunkt da en søknad er fremmet
  forhold_til_kilde: egendefinert
  merknad: Verken statsborgerloven eller utlendingsloven definerer termen. Avklar om det er innsending av skjema
    eller innlevering hos politiet. Arbeids- og velferdsetaten har et begrep med samme term, men URI-en i katalogen
    er en plassholder
  opphav: stbl. §§ 8, 10, 16 (flyttet fra utkastet for statsborgerskap)
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:tilbakekall-av-oppholdstillatelse
  anbefalt_term:
    nb: tilbakekall av oppholdstillatelse
    nn: tilbakekall av opphaldsløyve
  definisjon: vedtak som opphever en gitt oppholdstillatelse
  forhold_til_kilde: basert
  kilde: utlendingsloven § 63
  merknad: Kan blant annet skje når utlendingen mot bedre vitende har gitt uriktige opplysninger eller fortiet vesentlige
    forhold, eller etter alminnelige forvaltningsrettslige regler. Egne tilbakekallsregler gjelder for beskyttelse
    (§ 37)
  opphav: utl. kap. 7 (gjelder alle oppholdstillatelser)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  assosiativ:
  - til: fe:oppholdstillatelse
    rolle: opphever
- id: fe:tilleggstid
  anbefalt_term:
    nb: tilleggstid
    nn: tilleggstid
  definisjon: tid som legges til kravet til oppholdstid når det foreligger en utvisningsgrunn og utlendingen ikke
    blir utvist
  forhold_til_kilde: basert
  kilde: utlendingsloven § 62 sjette ledd
  merknad: Kan fastsettes i stedet for utvisning (§ 70 annet ledd) eller i vedtaket om oppholdstillatelse (§ 60
    sjette ledd), med inntil tre år. Beregnes etter forskriften §§ 11-5 til 11-5c
  opphav: utl. § 62 første ledd bokstav c og sjette ledd, forskriften §§ 11-5 til 11-5c (flyttet fra utkastet for
    permanent oppholdstillatelse)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:utdanningsinstitusjon
  anbefalt_term:
    nb: utdanningsinstitusjon
    nn: utdanningsinstitusjon
  tillatt_term:
  - lærested
  - studiested
  definisjon: virksomhet som gir utdanning, som universitet, høyskole, fagskole, videregående skole, folkehøgskole
    eller livssynsskole
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 6-19 første og annet ledd
  merknad: UDI kan i samråd med Kunnskapsdepartementet gi retningslinjer om hvilke institusjoner og studier som
    godkjennes
  opphav: forskriften § 6-19 (flyttet fra utkastet for studier)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
  generisk:
  - ext:virksomhet
- id: fe:utdanningsstotte
  anbefalt_term:
    nb: utdanningsstøtte
    nn: utdanningsstøtte
  definisjon: lån og stipend fra Statens lånekasse for utdanning
  forhold_til_kilde: basert
  kilde: utlendingsforskriften § 17-7f
  merknad: Opplysningene omfatter vedtak, støttebeløp og status på utbetalingene. Lånekassen har ikke publisert
    begrepet i begrepskatalogen
  opphav: utf. § 17-7f, stbf. § 14-2
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
  se_ogsa:
  - ext:stipend
- id: fe:vandel
  anbefalt_term:
    nb: vandel
    nn: vandel
  definisjon: forhold ved en utlendings tidligere atferd som kan gi grunn til å nekte utlendingen adgang til eller
    opphold i riket etter andre bestemmelser i loven
  forhold_til_kilde: basert
  kilde: utlendingsloven § 59
  merknad: Termen står i paragrafoverskriften. Kan ikke brukes til å nekte oppholdstillatelse etter § 28. Vandelskravene
    i statsborgerloven § 7 er et annet begrep
  opphav: utl. kap. 7 (gjelder alle oppholdstillatelser)
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:vedtakstidspunkt
  anbefalt_term:
    nb: vedtakstidspunkt
    nn: vedtakstidspunkt
  definisjon: tidspunkt da et vedtak er truffet
  forhold_til_kilde: egendefinert
  merknad: Vilkårene må som hovedregel være oppfylt på dette tidspunktet, jf. statsborgerloven § 7 og utlendingsloven
    § 62 tredje ledd
  opphav: stbl. § 7 første ledd (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:vedtaksutfall
  anbefalt_term:
    nb: vedtaksutfall
    nn: vedtaksutfall
  definisjon: resultatet av et vedtak
  forhold_til_kilde: egendefinert
  merknad: Verdiene gjenbruker UDIs publiserte begreper innvilgelse og avslag. Avklar om flere utfall brukes
  opphav: egen utledning (flyttet fra utkastet for statsborgerskap)
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
