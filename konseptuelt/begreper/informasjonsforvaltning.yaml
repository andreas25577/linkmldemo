# FORELØPIG UTKAST til demo. Begrepseierne er fiktive. Ikke godkjent faglig eller juridisk.
begreper:
- id: fe:ankomst-til-riket
  anbefalt_term:
    nb: ankomst til riket
    nn: framkomst til riket
  definisjon: tidspunkt da en person kom til Norge
  forhold_til_kilde: basert
  kilde: statsborgerforskriften § 3-1
  merknad: Sannsynliggjøres ved registrering hos politiet, i folkeregisteret eller på annen måte
  opphav: stbl. § 11, forskriften § 3-1 (flyttet fra utkastet for statsborgerskap)
  status: forslag
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:barnets-beste
  anbefalt_term:
    nb: hensynet til barnets beste
    nn: omsynet til det beste for barnet
  definisjon: vurdering av hva som samlet sett er best for barnet
  forhold_til_kilde: egendefinert
  merknad: Er et grunnleggende hensyn i saker som berører barn (utl. § 49 tredje ledd) og kan føre til avslag når
    bare én av foreldrene har tillatelse (§ 42 annet ledd). Innholdet følger av Grunnloven § 104 og barnekonvensjonen,
    som ikke er gjennomgått
  opphav: utl. § 42 annet ledd (flyttet fra utkastet for barn)
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
- id: fe:bosatt-i-riket
  anbefalt_term:
    nb: bosatt i riket
    nn: busett i riket
  definisjon: det å ha fast bopel i Norge
  forhold_til_kilde: basert
  kilde: statsborgerloven § 7 første ledd bokstav c
  merknad: Vilkåret er at søkeren er og vil forbli bosatt. Forholdet til folkeregisterlovens bosattbegrep må avklares.
    Skatteetatens bosatt i Norge er definert etter folkeregisterloven
  opphav: stbl. § 7 c, forskriften kap. 2 (flyttet fra utkastet for statsborgerskap); også stbl. §§ 20 til 22, 24
    og 25
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
  se_ogsa:
  - ext:bosatt-i-norge
- id: fe:familierelasjon
  anbefalt_term:
    nb: familierelasjon
    nn: familierelasjon
  definisjon: forhold mellom personer som er knyttet sammen gjennom ekteskap, samliv, slektskap eller adopsjon
  forhold_til_kilde: egendefinert
  kilde: utlendingsloven §§ 84 a og 87
  merknad: Loven bruker termen familie- og personrelasjoner (§ 84 a) og familierelasjon (§ 87) uten å definere dem
  opphav: utl. kap. 11 (opplysningskategori eller prosess som gjelder flere sakstyper)
  status: usikker
  begrepseier: informasjonsforvaltning
  samling: felles
