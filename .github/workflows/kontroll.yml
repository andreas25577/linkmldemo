name: Kontroll
# Kjører på hver pull request: LinkML-validering, kontrollene, SHACL og konsekvensanalyse som kommentar.
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent main til sammenligning
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Lint av LinkML-skjemaene
        run: |
          for s in metaskjema/*.yaml logisk/*.yaml; do linkml-lint --config .linkmllint.yaml "$s"; done

      - name: Valider begreper og hjemler mot metaskjemaene
        run: |
          for f in konseptuelt/begreper/*.yaml konseptuelt/eiere.yaml konseptuelt/samlinger.yaml konseptuelt/eksterne-begreper.yaml; do
            linkml-validate -s metaskjema/begrep.yaml -C Begrepsfil "$f"
          done
          for f in konseptuelt/hjemler/*.yaml; do linkml-validate -s metaskjema/hjemmel.yaml -C Hjemmelsfil "$f"; done

      - name: Konsekvensanalyse
        if: always()
        run: python verktoy/konsekvens.py .main . --rapport konsekvens.md

      - name: Referanser, eiere og kjedekontroll
        id: kontroll
        if: always()
        run: python verktoy/kontroll.py --rapport kontroll.md

      - name: Bygg RDF og valider mot SHACL
        if: always()
        run: python verktoy/rdf.py

      - name: Kommenter på pull requesten
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const les = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '';
            const body = '<!-- linkmldemo-kontroll -->\n' + les('kontroll.md') + '\n---\n' + les('konsekvens.md');
            const { owner, repo } = context.repo; const issue_number = context.issue.number;
            const k = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const gammel = k.find(c => c.body.startsWith('<!-- linkmldemo-kontroll -->'));
            if (gammel) await github.rest.issues.updateComment({ owner, repo, comment_id: gammel.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Skriv rapporten i sammendraget
        if: always()
        run: cat kontroll.md konsekvens.md >> "$GITHUB_STEP_SUMMARY" || true
